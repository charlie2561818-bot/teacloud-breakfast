<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>茶雲居訂 / Tea Cloud Breakfast</title>
<style>
#global-error-display {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: white; z-index: 9999;
  padding: 20px; color: red;
  overflow: auto;
}
</style>
</head>
<body class="bg-[#FAF9F6]">
<div id="root"></div>
<div id="global-error-display">
  <h2 class="text-xl font-bold mb-2">發生錯誤 (Error)</h2>
  <pre id="error-content" class="bg-gray-100 p-4 rounded border border-red-200 font-mono text-sm whitespace-pre-wrap"></pre>
</div>

<script>
window.onerror = function(message, source, lineno, colno, error) {
  document.getElementById('global-error-display').style.display = 'block';
  document.getElementById('error-content').textContent += `[Global Error] ${message}\nLine: ${lineno}\n\n`;
};
// 註冊全局自訂 Alert 事件
window.customAlert = function(msg) {
    window.dispatchEvent(new CustomEvent('show-alert', { detail: msg }));
};
</script>

<script type="module" src="/src/main.jsx"></script>
</body>
</html>
